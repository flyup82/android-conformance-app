name: build-publication

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-apk-matrix:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: conformance-release
    env:
      AQ_SIGNING_KEYSTORE_BASE64: ${{ secrets.AQ_SIGNING_KEYSTORE_BASE64 }}
      AQ_SIGNING_STORE_PASSWORD: ${{ secrets.AQ_SIGNING_STORE_PASSWORD }}
      AQ_SIGNING_KEY_ALIAS: ${{ secrets.AQ_SIGNING_KEY_ALIAS }}
      AQ_SIGNING_KEY_PASSWORD: ${{ secrets.AQ_SIGNING_KEY_PASSWORD }}
      AQ_SIGNING_CERTIFICATE_SHA256: ${{ vars.AQ_SIGNING_CERTIFICATE_SHA256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - name: Validate exact public source and build contract
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 tools/validate_public_handoff.py
          python3 -m unittest discover -s tests -v
      - name: Install exact Android build packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Verify exact Android build packages
        run: |
          set -euo pipefail
          grep -Eq '^Pkg[.]Revision[[:space:]]*=[[:space:]]*36[.]0[.]0[[:space:]]*$' \
            "$ANDROID_HOME/build-tools/36.0.0/source.properties"
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
      - name: Materialize external signing input
        run: |
          set -euo pipefail
          test -n "$AQ_SIGNING_KEYSTORE_BASE64"
          test -n "$AQ_SIGNING_STORE_PASSWORD"
          test -n "$AQ_SIGNING_KEY_ALIAS"
          test -n "$AQ_SIGNING_KEY_PASSWORD"
          [[ "$AQ_SIGNING_CERTIFICATE_SHA256" =~ ^sha256:[0-9a-f]{64}$ ]]
          AQ_SIGNING_KEYSTORE="$RUNNER_TEMP/android-conformance-release.jks"
          printf '%s' "$AQ_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$AQ_SIGNING_KEYSTORE"
          chmod 0600 "$AQ_SIGNING_KEYSTORE"
          {
            echo "AQ_SIGNING_KEYSTORE=$AQ_SIGNING_KEYSTORE"
          } >> "$GITHUB_ENV"
      - name: Verify signing certificate before build
        run: |
          set -euo pipefail
          observed="$(
            keytool -exportcert \
              -keystore "$AQ_SIGNING_KEYSTORE" \
              -storepass:env AQ_SIGNING_STORE_PASSWORD \
              -alias "$AQ_SIGNING_KEY_ALIAS" |
              sha256sum |
              awk '{print "sha256:" $1}'
          )"
          test "$observed" = "$AQ_SIGNING_CERTIFICATE_SHA256"
      - name: Build and stage exact signed APK matrix
        run: |
          set -euo pipefail
          python3 tools/build_publication.py \
            --execute \
            --source-revision "$GITHUB_SHA" \
            --certificate-sha256 "$AQ_SIGNING_CERTIFICATE_SHA256" \
            --apksigner "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            --output-dir "$RUNNER_TEMP/publication"
      - name: Upload signed APK publication
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-conformance-r2-${{ github.sha }}
          path: ${{ runner.temp }}/publication
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: false
      - name: Record public artifact identity
        run: |
          set -euo pipefail
          {
            echo "source_revision=$GITHUB_SHA"
            echo "artifact_id=${{ steps.upload.outputs.artifact-id }}"
            echo "artifact_digest=${{ steps.upload.outputs.artifact-digest }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove external signing input
        if: always()
        run: rm -f "$RUNNER_TEMP/android-conformance-release.jks"
