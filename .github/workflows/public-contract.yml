name: public-contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - name: Validate public handoff
        run: python3 tools/validate_public_handoff.py
      - name: Run deterministic tests
        run: python3 -m unittest discover -s tests -v
      - name: Run pure-Java behavior unit tests
        run: python3 tools/run_behavior_unit_tests.py
      - name: Install exact Android compile packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Verify exact Android compile packages
        run: |
          grep -Eq '^Pkg[.]Revision[[:space:]]*=[[:space:]]*36[.]0[.]0[[:space:]]*$' \
            "$ANDROID_HOME/build-tools/36.0.0/source.properties"
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
      - name: Compile all public source compositions
        run: python3 tools/compile_source_matrix.py --execute
      - name: Reject tracked signing material
        run: |
          if git ls-files | grep -E '\.(jks|keystore)$'; then
            echo "tracked signing material is forbidden" >&2
            exit 1
          fi
